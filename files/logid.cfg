devices: (
    {
    name: "MX Master 3S";
    smartshift: # Smart Shift Auto Toggle Config
    {
        on: true;
        threshold: 10;
    };
    hiresscroll:
    {
        hires: true;
        invert: false;
        target: false;
    };
    buttons: (
        {
            cid: 0xc3; # Geasture Button Config
            action = 
            {
                type: "Gestures";
                gestures: (
                    { 
                        direction: "Left"; # when moves left
                        mode: "OnRelease"; 
                        action = 
                        { 
                        type: "Keypress"; 
                        keys: 
                            ["KEY_LEFTALT", "KEY_LEFTMETA", "KEY_RIGHT"]; # Switch One workspace left
                        }; 
                    },
                    { 
                        direction: "Right";  #When moves right
                        mode: "OnRelease"; 
                        action = { 
                        type: "Keypress"; 
                        keys: 
                            ["KEY_LEFTALT", "KEY_LEFTMETA", "KEY_LEFT"];  # Switch One workspace right
                        }; 
                    },
                    { 
                        direction: "Up";  #When moveds up
                        mode: "OnRelease"; 
                        action = { 
                        type: "Keypress"; 
                        keys: 
                            ["KEY_LEFTMETA", "KEY_A"];  # Show all Apps
                        }; 
                    },
                    { 
                        direction: "none"; # Just Click and release 
                        mode: "OnRelease"; 
                        action = 
                        { 
                        type: "Keypress";
                        keys: 
                            ["KEY_LEFTMETA"]; # Open Activities Screen
                        }; 
                    }
                );
            };
        },
        { 
            cid: 0xc4; # Smart Shift Button, Behind the big scroll, 
            action = 
                        {
                type: "Gestures";
                gestures: (
                    { 
                        direction: "None";  
                        mode: "OnRelease"; 
                        action = 
                        { type: "CycleDPI"; # Change the DPI Resulution
                        dpis: 
                            [ 500, 750, 1000, 1250, 1500, 2000, 2500, 3000, 4000, 8000 ];
                        }; 
                    }
                );
            };
        },
        {
            cid: 0x56; # Forward Button
            action = 
            { 
                type: "Keypress"; 
                keys: 
                    [ "KEY_LEFTCTRL", "KEY_LEFTSHIFT", "KEY_V" ];  # Do Paste
            }
        }
    );
  }
);
